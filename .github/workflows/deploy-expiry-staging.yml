name: Deploy LOGOS Test Driller expiry (STAGING)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          PROJECT_REF: rxuusshnsrpegwwktvii
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$CRON_SECRET"
          npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" SUPABASE_URL="https://$PROJECT_REF.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" CRON_SECRET="$CRON_SECRET"
          npx --yes supabase@latest functions deploy finalize-expired-tests --project-ref "$PROJECT_REF" --no-verify-jwt
