name: Student Portal Checks

on:
  push:
    branches:
      - stage-2R37-student-portal-frontend
      - stage-2R38-registration-login-import-foundation
      - stage-2R39-controlled-assessment-upload
      - stage-2R40-staging-project-isolation
  pull_request:
    branches:
      - stage-2R37-student-portal-frontend
      - stage-2R39-controlled-assessment-upload
      - stage-2R40-staging-project-isolation

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check portal JavaScript
        run: node --check portal.js
      - name: Syntax-check website JavaScript
        run: node --check script.js
      - name: Syntax-check admin JavaScript
        run: node --check admin-portal.js
      - name: Check staging Supabase configuration isolation
        run: node staging-config.test.cjs
      - name: Check student profile migration safety
        run: node test-student-profile-migration.test.cjs
      - name: Check admin student import RPC safety
        run: node test-admin-student-import-rpc.test.cjs
      - name: Syntax-check student import validator
        run: node --check student-import.js
      - name: Check student import validation tests
        run: node student-import.test.cjs
      - name: Syntax-check Test Driller question import
        run: node --check test-question-import.js
      - name: Check Test Driller question import tests
        run: node test-question-import.test.cjs
      - name: Check controlled assessment migration invariants
        run: node test-controlled-assessment-migration.test.cjs
      - name: Check staging Test Driller foundation invariants
        run: node test-staging-test-driller-foundation.test.cjs
      - name: Check staging support RPC restoration invariants
        run: node test-staging-support-rpcs.test.cjs
      - name: Check expiry worker security contract
        run: node test-expiry-worker.test.cjs
      - name: Check frontend-to-database assessment contract
        run: node test-controlled-assessment-frontend-contract.test.cjs
      - name: Check required portal files
        run: |
          test -s student-portal.html
          test -s portal.css
          test -s portal.js
          test -s admin-portal.html
          test -s admin-portal.js
          test -s student-import.js
          test -s test-question-import.js
          test -s test-question-import.test.cjs
          test -s test-controlled-assessment-migration.test.cjs
          test -s test-staging-test-driller-foundation.test.cjs
          test -s test-staging-support-rpcs.test.cjs
          test -s test-expiry-worker.test.cjs
          test -s test-controlled-assessment-frontend-contract.test.cjs
          test -s docs/STAGING_RESTORE_ORIGINAL_SUPPORT_RPCS.sql
          test -s docs/STAGING_TEST_DRILLER_FOUNDATION.sql
          test -s TEST_DRILLER_ASSESSMENT_UPLOAD_SPEC.md
