name: Finalize expired LOGOS Test Driller attempts (STAGING)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Call staging expiry function
        env:
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --request POST "https://rxuusshnsrpegwwktvii.supabase.co/functions/v1/finalize-expired-tests" --header "x-cron-secret: $CRON_SECRET" --header "Content-Type: application/json" --data "{}"
