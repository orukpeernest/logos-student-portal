<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGOS Student Portal Sign In</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f6fb;font-family:system-ui;color:#251c30;padding:18px}.box{background:white;border-radius:18px;padding:30px;max-width:430px;width:100%;box-shadow:0 12px 45px #38135318}h1{color:#381353}label{display:block;margin:15px 0 6px;font-weight:700;font-size:13px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}button{margin-top:20px;background:#5c2389;color:white;border:0;padding:13px;border-radius:9px;width:100%;font-weight:800}#status{display:none;background:#fff5e3;border-left:3px solid #d8ad46;padding:12px;border-radius:8px;font-size:13px;margin-top:15px}small{color:#716a78}</style></head><body><main class="box"><p style="color:#c32b35;font-weight:900;letter-spacing:1px">LOGOS TUTORIALS • STUDENT PORTAL</p><h1>Welcome back</h1><p>Sign in using your student account credentials.</p><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">Sign in</button></form><div id="status" role="status"></div><small>Authentication scaffold preview. Student records and portal data are not connected.</small></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const status=document.getElementById('status'),btn=document.getElementById('btn');function say(t){status.textContent=t;status.style.display='block'}document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';try{const c=window.LOGOS_SUPABASE_CONFIG;if(!c||!c.url||c.url.includes('PASTE_')||!c.publishableKey||c.publishableKey.includes('PASTE_'))throw new Error('Supabase public client configuration is not set. Contact the portal administrator.');const sb=window.supabase.createClient(c.url,c.publishableKey);const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;say('Sign-in succeeded. Student dashboard/data access is not implemented yet. Please contact LOGOS Tutorials.')}catch(err){say(err.message||'Unable to sign in. Please try again.')}finally{btn.disabled=false;btn.textContent='Sign in'}});</script></body></html>
